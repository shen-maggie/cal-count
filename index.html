<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FastCal</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FastCal">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><h1 id="pageTitle">FastCal</h1></header>
  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="home" class="active"><span>⏱</span>Home</button>
    <button data-tab="food"><span>🍽</span>Food</button>
    <button data-tab="weight"><span>⚖️</span>Weight</button>
    <button data-tab="library"><span>📖</span>Recipes</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel"><div id="sheetBody"></div></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
